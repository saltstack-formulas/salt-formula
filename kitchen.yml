##########################################################
# This file is managed as part of a Copier template.     #
# Please make your own changes below this comment.       #
##########################################################

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    provisioner:
      state_top:
        base:
          '*':
            - salt._mapdata
            - salt.pkgrepo
            - salt.master
            - salt.minion
    verifier:
      inspec_tests:
        - path: test/integration/default
