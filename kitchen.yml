# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: salt
  salt_copy_filter:
    - .kitchen
    - .git
  pillars_from_directories:
    - test/salt/pillar

transport:
  # Avoid lengthy waits when a container does not launch correctly
  max_wait_until_ready: 60

platforms:
  ## SALT `master`
  - name: debian-13-master
    driver:
      image: saltimages/salt-master-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-12-master
    driver:
      image: saltimages/salt-master-py3:debian-12
      run_command: /lib/systemd/systemd
  - name: ubuntu-2604-master
    driver:
      image: saltimages/salt-master-py3:ubuntu-26.04
      run_command: /lib/systemd/systemd
  - name: ubuntu-2404-master
    driver:
      image: saltimages/salt-master-py3:ubuntu-24.04
      run_command: /lib/systemd/systemd
  - name: ubuntu-2204-master
    driver:
      image: saltimages/salt-master-py3:ubuntu-22.04
      run_command: /lib/systemd/systemd
  - name: centos-stream9-master
    driver:
      image: saltimages/salt-master-py3:centos-stream9
  - name: opensuse-leap-160-master
    driver:
      image: saltimages/salt-master-py3:opensuse-leap-16.0
    # Workaround to avoid intermittent failures on `opensuse-leap-16.0`:
    # => SCP did not finish successfully (255):  (Net::SCP::Error)
    transport:
      max_ssh_sessions: 1
  - name: opensuse-tmbl-latest-master
    driver:
      image: saltimages/salt-master-py3:opensuse-tumbleweed-latest
    # Workaround to avoid intermittent failures on `opensuse-tumbleweed`:
    # => SCP did not finish successfully (255):  (Net::SCP::Error)
    transport:
      max_ssh_sessions: 1
  - name: fedora-44-master
